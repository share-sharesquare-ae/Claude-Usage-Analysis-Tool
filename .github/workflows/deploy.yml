name: Deploy to Windows Server (Dev)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Sync Code and Restart via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WINDOWS_SERVER_IP }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: 22
          script: |
            cd C:\inetpub\wwwroot\claude-app-dev
            git pull origin dev
            docker compose down
            docker compose up -d --build
