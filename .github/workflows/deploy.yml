name: Deploy to Windows Server (Dev)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Package and Deploy to Windows Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WINDOWS_SERVER_IP }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: 22
          script: |
            # Ensure target directory exists on the server
            if (!(Test-Path "C:\inetpub\wwwroot\claude-app-dev")) {
                New-Item -ItemType Directory -Force -Path "C:\inetpub\wwwroot\claude-app-dev"
            }
            Write-Host "Target directory ready."

      - name: Copy Project Files via SCP
        uses: cross-the-world/ssh-scp-ssh-pipelines@latest
        with:
          host: ${{ secrets.WINDOWS_SERVER_IP }}
          user: ${{ secrets.WINDOWS_SERVER_USER }}
          pass: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: 22
          connect_timeout: 30s
          scp: |
            ./* => C:\inetpub\wwwroot\claude-app-dev/

      - name: Execute Docker Compose Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WINDOWS_SERVER_IP }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: 22
          script: |
            cd C:\inetpub\wwwroot\claude-app-dev
            docker compose down
            docker compose up -d --build
