name: Deploy to Windows Server (Dev)

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy Files to Windows Server via Native SCP
        shell: pwsh
        env:
          SERVER_IP: ${{ secrets.WINDOWS_SERVER_IP }}
          SERVER_USER: ${{ secrets.WINDOWS_SERVER_USER }}
          SERVER_PASS: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
        run: |
          # Use native OpenSSH client available on windows-latest runner
          # We use pscp or standard scp with sshpass or environment variables. 
          # Alternatively, since password auth via scp non-interactively can be tricky without keys, 
          # we can use dotnet/PowerShell or a small script, OR switch the ssh-action to handle everything.
